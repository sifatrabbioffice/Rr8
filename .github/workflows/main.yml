    - name: Create File Manager view
      run: |
        cat > LinuxOS/Sources/FileManagerViewController.swift << 'EOFSWIFT'
        import UIKit
        
        class FileManagerViewController: UIViewController, UITableViewDelegate, UITableViewDataSource {
            
            private let tableView = UITableView()
            private let linuxEngine: EmbeddedLinuxEngine
            
            private let files = [
                "📁 bin/", "📁 boot/", "📁 home/", "📁 opt/",
                "📁 proc/", "📁 sys/", "📁 tmp/", "📁 var/",
                "📄 README.txt", "📄 .bashrc", "📄 .profile"
            ]
            
            init(linuxEngine: EmbeddedLinuxEngine) {
                self.linuxEngine = linuxEngine
                super.init(nibName: nil, bundle: nil)
            }
            
            required init?(coder: NSCoder) {
                fatalError("init(coder:) has not been implemented")
            }
            
            override func viewDidLoad() {
                super.viewDidLoad()
                title = "File Manager"
                setupUI()
            }
            
            private func setupUI() {
                view.backgroundColor = UIColor(red: 0.1, green: 0.1, blue: 0.1, alpha: 1.0)
                
                tableView.backgroundColor = UIColor(red: 0.12, green: 0.12, blue: 0.12, alpha: 1.0)
                tableView.delegate = self
                tableView.dataSource = self
                tableView.register(UITableViewCell.self, forCellReuseIdentifier: "cell")
                view.addSubview(tableView)
                tableView.translatesAutoresizingMaskIntoConstraints = false
                NSLayoutConstraint.activate([
                    tableView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                    tableView.leftAnchor.constraint(equalTo: view.leftAnchor),
                    tableView.rightAnchor.constraint(equalTo: view.rightAnchor),
                    tableView.bottomAnchor.constraint(equalTo: view.bottomAnchor)
                ])
            }
            
            func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                return files.count
            }
            
            func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                let cell = tableView.dequeueReusableCell(withIdentifier: "cell", for: indexPath)
                cell.textLabel?.text = files[indexPath.row]
                cell.textLabel?.textColor = UIColor(red: 0.8, green: 0.8, blue: 0.8, alpha: 1.0)
                cell.backgroundColor = UIColor(red: 0.15, green: 0.15, blue: 0.15, alpha: 1.0)
                return cell
            }
        }
        EOFSWIFT

